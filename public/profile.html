<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | CineMagic</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .profile-container {
            max-width: 1000px;
            margin: 100px auto 2rem;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
        }
        .profile-sidebar {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
        }
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--primary-color), #ff6b6b);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            margin: 0 auto 1.5rem;
            color: white;
            box-shadow: 0 10px 20px rgba(255,51,102,0.3);
        }
        .profile-info h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .profile-info p {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }
        .profile-nav {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .profile-nav button {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 1rem;
            text-align: left;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .profile-nav button:hover, .profile-nav button.active {
            background: rgba(255,255,255,0.05);
            color: var(--primary-color);
        }
        .profile-content {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2.5rem;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        /* Forms */
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }
        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: white;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        .btn-save {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        
        /* Bookings List */
        .booking-card {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .booking-details h4 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
        }
        .booking-status {
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            background: rgba(77, 255, 136, 0.1);
            color: #4dff88;
        }

        #msg-box {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: none;
        }
        .success { background: rgba(77, 255, 136, 0.1); color: #4dff88; border: 1px solid rgba(77, 255, 136, 0.3); }
        .error { background: rgba(255, 77, 77, 0.1); color: #ff4d4d; border: 1px solid rgba(255, 77, 77, 0.3); }

        @media (max-width: 768px) {
            .profile-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="index.html" style="color:var(--primary-color); text-decoration:none;"><i class="fa-solid fa-film"></i> CineMagic</a>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="#">Movies</a>
            <a href="#">Theatres</a>
        </div>
        <div class="nav-auth">
            <!-- Dynamically populated -->
        </div>
    </nav>

    <!-- Ticket Modal -->
    <div class="modal-overlay" id="ticket-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2000; align-items:center; justify-content:center;">
        <div class="ticket-box" style="background:#fff; border-radius:16px; padding:2rem; width:90%; max-width:400px; color:#333; position:relative;">
            <button onclick="document.getElementById('ticket-modal').style.display='none'" style="position:absolute; top:1rem; right:1rem; background:none; border:none; font-size:1.5rem; cursor:pointer; color:#888;"><i class="fa-solid fa-xmark"></i></button>
            <div style="text-align:center; margin-bottom:1.5rem;">
                <i class="fa-solid fa-film" style="font-size:2.5rem; color:var(--primary-color);"></i>
                <h2 style="margin-top:0.5rem; font-family:'Outfit',sans-serif;">CineMagic Ticket</h2>
            </div>
            <div style="border-top:2px dashed #ccc; border-bottom:2px dashed #ccc; padding:1.5rem 0; margin-bottom:1.5rem;">
                <p><strong>Booking ID:</strong> <span id="t-id"></span></p>
                <p><strong>Show ID:</strong> <span id="t-show"></span></p>
                <p><strong>Seats:</strong> <span id="t-seats"></span></p>
                <p><strong>Total Paid:</strong> ₹<span id="t-amount"></span></p>
            </div>
            <div style="text-align:center;">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=CineMagic" id="t-qr" alt="QR Code" style="border-radius:8px;">
                <p style="color:#888; font-size:0.8rem; margin-top:0.5rem;">Scan at cinema entrance</p>
                <button class="btn-save" style="width:100%; margin-top:1rem;" onclick="window.print()"><i class="fa-solid fa-print"></i> Print Ticket</button>
            </div>
        </div>
    </div>

    <div class="profile-container">
        <div class="profile-sidebar">
            <div class="profile-avatar">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="profile-info">
                <h3 id="user-name">Loading...</h3>
                <p id="user-email">Loading...</p>
            </div>
            <div class="profile-nav">
                <button class="active" onclick="switchTab('details', this)"><i class="fa-solid fa-address-card"></i> My Details</button>
                <button onclick="switchTab('bookings', this)"><i class="fa-solid fa-ticket"></i> My Bookings</button>
                <button onclick="switchTab('security', this)"><i class="fa-solid fa-shield-halved"></i> Security</button>
            </div>
        </div>

        <div class="profile-content">
            <!-- My Details Tab -->
            <div id="tab-details" class="tab-content active">
                <h2 style="margin-bottom: 1.5rem;">Account Details</h2>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="profile-username" class="form-control" disabled>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="profile-email" class="form-control" disabled>
                </div>
                <div class="form-group">
                    <label>Role</label>
                    <input type="text" id="profile-role" class="form-control" disabled>
                </div>
            </div>

            <!-- My Bookings Tab -->
            <div id="tab-bookings" class="tab-content">
                <h2 style="margin-bottom: 1.5rem;">My Bookings</h2>
                <div id="bookings-container">
                    <p style="color: var(--text-muted)">Loading bookings...</p>
                </div>
            </div>

            <!-- Security Tab -->
            <div id="tab-security" class="tab-content">
                <h2 style="margin-bottom: 1.5rem;">Change Password</h2>
                <div id="msg-box"></div>
                <form id="password-form">
                    <div class="form-group">
                        <label>Current Password</label>
                        <input type="password" id="old-password" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password" id="new-password" class="form-control" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label>Confirm New Password</label>
                        <input type="password" id="confirm-password" class="form-control" required minlength="6">
                    </div>
                    <button type="submit" class="btn-save">Update Password</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Check auth immediately
        if (!Auth.isAuthenticated()) {
            window.location.href = 'login.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const user = Auth.getUser();
            
            // Populate details
            document.getElementById('user-name').textContent = user.username;
            document.getElementById('user-email').textContent = user.email;
            
            document.getElementById('profile-username').value = user.username;
            document.getElementById('profile-email').value = user.email;
            document.getElementById('profile-role').value = user.role.toUpperCase();

            // Load bookings
            fetchBookings();
        });

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.profile-nav button').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`tab-${tabId}`).classList.add('active');
            btn.classList.add('active');
        }

        async function fetchBookings() {
            const container = document.getElementById('bookings-container');
            const user = Auth.getUser();
            try {
                // Fetching from backend mapping logic
                const res = await Auth.fetchWithAuth(`/booking/my-bookings/${user._id}`);
                if (!res.ok) throw new Error('Failed to fetch');
                const data = await res.json();
                
                // Expecting array of bookings
                const bookings = Array.isArray(data) ? data : (data.data || data.Bookings || data.Booking || []);
                
                if (bookings.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-muted)">You have no bookings yet.</p>';
                    return;
                }

                container.innerHTML = bookings.map(b => {
                    const isCancelled = (b.bookingStatus || b.status) === 'cancelled';
                    const movieName = b.show?.movieId?.title || b.show?.title || (typeof b.show === 'string' ? `ID: ${b.show}` : 'Unknown Movie');
                    const showIdStr = typeof b.show === 'string' ? b.show : (b.show?._id || '');
                    
                    let seatsStr = 'N/A';
                    if (b.bookedSeats && Array.isArray(b.bookedSeats)) {
                        seatsStr = b.bookedSeats.map(s => `${s.row}${s.number}`).join(', ');
                    } else if (b.seats) {
                        seatsStr = Array.isArray(b.seats) ? b.seats.join(', ') : b.seats;
                    }

                    return `
                    <div class="booking-card">
                        <div class="booking-details">
                            <h4>${movieName}</h4>
                            <p style="color: var(--text-muted); font-size: 0.9rem;">
                                Seats: ${seatsStr} <br>
                                Total Amount: ₹${b.totalAmount || b.totalamount || '0'}
                            </p>
                            <div style="margin-top: 1rem; display: flex; gap: 0.5rem;">
                                ${!isCancelled ? `<button class="btn-save" style="padding: 0.5rem 1rem; font-size: 0.85rem;" onclick="viewTicket('${b._id}', '${movieName.replace(/'/g, "\\'")}', '${seatsStr}', '${b.totalAmount || b.totalamount || 0}')"><i class="fa-solid fa-ticket"></i> View Ticket</button>` : ''}
                                ${!isCancelled ? `<button class="btn-save" style="padding: 0.5rem 1rem; font-size: 0.85rem; background: #ff4d4d;" onclick="cancelBooking('${b._id}')"><i class="fa-solid fa-xmark"></i> Cancel</button>` : ''}
                            </div>
                        </div>
                        <div class="booking-status" style="${isCancelled ? 'background: rgba(255,77,77,0.1); color: #ff4d4d;' : ''}">${b.bookingStatus || b.status || 'Confirmed'}</div>
                    </div>
                `}).join('');

            } catch (err) {
                console.error(err);
                container.innerHTML = '<p style="color: #ff4d4d">Error loading bookings.</p>';
            }
        }

        window.viewTicket = function(id, show, seats, amount) {
            document.getElementById('t-id').textContent = id;
            document.getElementById('t-show').textContent = show;
            document.getElementById('t-seats').textContent = seats;
            document.getElementById('t-amount').textContent = amount;
            document.getElementById('t-qr').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=CineMagic_Booking_${id}`;
            document.getElementById('ticket-modal').style.display = 'flex';
        };

        window.cancelBooking = async function(id) {
            if(!confirm("Are you sure you want to cancel this ticket? This action cannot be undone.")) return;
            try {
                const res = await Auth.fetchWithAuth('/booking/cancel-booking/' + id, { method: 'DELETE' });
                if (!res.ok) throw new Error('Failed to cancel booking');
                alert("Booking cancelled successfully.");
                fetchBookings();
            } catch (err) {
                alert(err.message);
            }
        };

        document.getElementById('password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const oldPassword = document.getElementById('old-password').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const msgBox = document.getElementById('msg-box');

            if (newPassword !== confirmPassword) {
                msgBox.className = 'error';
                msgBox.textContent = 'New passwords do not match!';
                msgBox.style.display = 'block';
                return;
            }

            try {
                const res = await Auth.fetchWithAuth('/user/changecurrentpassword', {
                    method: 'POST',
                    body: { oldPassword, newPassword }
                });

                if (!res.ok) {
                    const txt = await res.text();
                    throw new Error(txt || 'Password update failed');
                }

                msgBox.className = 'success';
                msgBox.textContent = 'Password updated successfully!';
                msgBox.style.display = 'block';
                document.getElementById('password-form').reset();

            } catch (err) {
                msgBox.className = 'error';
                msgBox.textContent = err.message;
                msgBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
