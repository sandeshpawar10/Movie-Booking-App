<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMagic | Premium Movie Booking</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fa-solid fa-film"></i> CineMagic
        </div>
        <div class="nav-links">
            <a href="index.html" class="active">Home</a>
            <a href="index.html#movies-container">Movies</a>
            <a href="theatres.html">Theatres</a>
        </div>
        <div class="nav-auth">
            <button class="btn-login">Login</button>
            <button class="btn-signup">Sign Up</button>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero">
        <div class="hero-content">
            <h1>Experience Cinema Like Never Before</h1>
            <p>Book tickets for the latest blockbusters in premium theaters near you.</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div class="section-header">
            <h2>Now Showing</h2>
            <div style="display:flex; gap:1rem; align-items:center;">
                <div class="search-bar" style="position:relative;">
                    <input type="text" id="movie-search" placeholder="Search movies..." style="padding:0.6rem 1rem 0.6rem 2.5rem; border-radius:30px; border:1px solid var(--glass-border); background:rgba(0,0,0,0.2); color:white; width:250px;">
                    <i class="fa-solid fa-search" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-muted);"></i>
                </div>
                <div class="filters">
                    <select id="home-city-filter" style="padding:0.6rem 1.5rem; border-radius:30px; border:1px solid var(--glass-border); background:rgba(0,0,0,0.2); color:white; appearance:none; background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23ffffff%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E'); background-repeat: no-repeat; background-position: right 1rem top 50%; background-size: 0.65rem auto; padding-right: 2.5rem; cursor:pointer;">
                        <option value="" style="background:var(--bg-card); color:white;">All Cities</option>
                        <option value="Mumbai" style="background:var(--bg-card); color:white;">Mumbai</option>
                        <option value="Delhi" style="background:var(--bg-card); color:white;">Delhi</option>
                        <option value="Bangalore" style="background:var(--bg-card); color:white;">Bangalore</option>
                        <option value="Hyderabad" style="background:var(--bg-card); color:white;">Hyderabad</option>
                        <option value="Chennai" style="background:var(--bg-card); color:white;">Chennai</option>
                    </select>
                </div>
                <div class="filters">
                    <button class="filter-btn active">All</button>
                    <button class="filter-btn">Action</button>
                    <button class="filter-btn">Comedy</button>
                    <button class="filter-btn">Drama</button>
                </div>
            </div>
        </div>

        <div class="movies-grid" id="movies-container">
            <!-- Movie cards will be dynamically injected here -->
            <div class="loading-spinner"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 CineMagic. All rights reserved.</p>
    </footer>

    <script src="js/auth.js"></script>
    <script src="app.js"></script>
</body>
</html>
