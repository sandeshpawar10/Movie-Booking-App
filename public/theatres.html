<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theatres | CineMagic</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet for Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        .theatres-container {
            max-width: 1200px;
            margin: 100px auto 2rem;
            padding: 2rem 5%;
        }
        
        .page-header {
            text-align: center;
            margin-bottom: 4rem;
        }
        .page-header h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        .theatres-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .theatre-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 2rem;
            transition: all 0.3s;
        }

        .theatre-card:hover {
            transform: translateY(-10px);
            border-color: rgba(255,51,102,0.3);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }
        
        .filters-container {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .form-control {
            padding: 0.8rem 1.5rem;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            color: white;
            font-family: 'Outfit', sans-serif;
            width: 250px;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23ffffff%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 1.2rem top 50%;
            background-size: 0.65rem auto;
            cursor: pointer;
        }
        .form-control option {
            background: var(--bg-card);
            color: white;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        .btn-view {
            background: rgba(255,51,102,0.1);
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            width: 100%;
            transition: all 0.3s;
        }
        .btn-view:hover {
            background: var(--primary-color);
            color: white;
        }

        .t-name {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .t-meta {
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="index.html" style="color:var(--primary-color); text-decoration:none;"><i class="fa-solid fa-film"></i> CineMagic</a>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#movies">Movies</a>
            <a href="theatres.html" class="active">Theatres</a>
        </div>
        <div class="nav-auth"></div>
    </nav>

    <div class="theatres-container">
        <div class="page-header">
            <h1>Partner Theatres</h1>
            <p style="color:var(--text-muted); font-size:1.1rem;">Find a premium cinema experience near you</p>
        </div>
        
        <div class="filters-container">
            <select id="city-filter" class="form-control" onchange="filterTheatres(this.value)">
                <option value="">All Cities</option>
                <option value="Mumbai">Mumbai</option>
                <option value="Delhi">Delhi</option>
                <option value="Bangalore">Bangalore</option>
                <option value="Hyderabad">Hyderabad</option>
                <option value="Chennai">Chennai</option>
            </select>
        </div>
        
        <div class="theatres-grid" id="theatres-grid">
            <div class="loading-spinner"></div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        let allTheatres = [];

        async function fetchTheatres() {
            try {
                const res = await fetch('/theatre/all-theatre');
                if (!res.ok) throw new Error('Failed to fetch');
                const data = await res.json();
                
                allTheatres = data.Theatres || data.data || data;
                renderTheatres(allTheatres);
            } catch (error) {
                console.error(error);
                document.getElementById('theatres-grid').innerHTML = '<p style="color:#ff4d4d; grid-column:1/-1;text-align:center;">Error loading theatres.</p>';
            }
        }

        async function filterTheatres(city) {
            if (!city) {
                renderTheatres(allTheatres);
                return;
            }
            try {
                // Testing the getTheatreByCity endpoint
                const res = await fetch('/theatre/theatre-by-city?city=' + encodeURIComponent(city));
                if (!res.ok) {
                    // Fallback to local filtering if endpoint fails
                    renderTheatres(allTheatres.filter(t => (t.location?.city || t.city || '').toLowerCase() === city.toLowerCase()));
                    return;
                }
                const data = await res.json();
                const theatres = data.data || data.Theatres || data;
                renderTheatres(theatres);
            } catch (e) {
                renderTheatres(allTheatres.filter(t => (t.location?.city || t.city || '').toLowerCase() === city.toLowerCase()));
            }
        }

        function renderTheatres(theatres) {
            if (theatres.length === 0) {
                document.getElementById('theatres-grid').innerHTML = '<p style="grid-column:1/-1;text-align:center;">No theatres found.</p>';
                return;
            }

            document.getElementById('theatres-grid').innerHTML = theatres.map(t => `
                <div class="theatre-card">
                    <div class="t-name"><i class="fa-solid fa-building"></i> ${t.name}</div>
                    <div class="t-meta"><i class="fa-solid fa-location-dot"></i> ${t.location?.city || t.city || 'Unknown City'}</div>
                    <div class="t-meta"><i class="fa-solid fa-map-pin"></i> ${t.location?.state || t.state || 'Unknown State'}</div>
                    <button class="btn-view" onclick="viewShows('${t._id}', '${(t.name||'').replace(/'/g,"\\'")}')">View Shows</button>
                    <button class="btn-view" style="background:rgba(255,255,255,0.1); color:white; margin-top:0.5rem;" onclick="viewMap('${t._id}', '${t.location?.address || t.address || ''}', '${t.location?.city || t.city || ''}')"><i class="fa-solid fa-map"></i> View Map</button>
                    <div id="shows-${t._id}" style="margin-top:1rem; font-size:0.9rem; display:none;"></div>
                    <div id="map-${t._id}" style="margin-top:1rem; height:200px; display:none; border-radius:8px; z-index:0;"></div>
                </div>
            `).join('');
        }

        let mapInstances = {};

        async function viewMap(id, address, city) {
            const mapDiv = document.getElementById('map-' + id);
            
            // Toggle map visibility
            if (mapDiv.style.display === 'block') {
                mapDiv.style.display = 'none';
                return;
            }
            
            mapDiv.style.display = 'block';

            if (mapInstances[id]) {
                // Need to invalidate size after making it visible
                setTimeout(() => mapInstances[id].invalidateSize(), 100);
                return;
            }

            mapDiv.innerHTML = '<p style="color:var(--text-muted); text-align:center; margin-top:20%;">Loading map...</p>';

            try {
                // Geocode using Nominatim
                const query = encodeURIComponent(`${address}, ${city}`);
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}&limit=1`);
                let data = await res.json();
                
                let lat, lon;
                if (data && data.length > 0) {
                    lat = data[0].lat;
                    lon = data[0].lon;
                } else {
                    // Fallback to City level if full address fails
                    const resCity = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(city)}&limit=1`);
                    const dataCity = await resCity.json();
                    if (dataCity && dataCity.length > 0) {
                        lat = dataCity[0].lat;
                        lon = dataCity[0].lon;
                    } else {
                        mapDiv.innerHTML = '<p style="color:#ff4d4d; text-align:center; margin-top:20%;">Location not found.</p>';
                        return;
                    }
                }
                
                mapDiv.innerHTML = ''; // clear loading text
                
                const map = L.map('map-' + id).setView([lat, lon], 14);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; OpenStreetMap & CARTO'
                }).addTo(map);
                
                L.marker([lat, lon]).addTo(map)
                    .bindPopup(`<a href="https://www.google.com/maps/search/?api=1&query=${lat},${lon}" target="_blank" style="color:#000; font-weight:bold;">Get Directions</a>`);
                    
                mapInstances[id] = map;
                
                // Ensure tiles load correctly in initially hidden div
                setTimeout(() => map.invalidateSize(), 100);

            } catch (err) {
                console.error(err);
                mapDiv.innerHTML = '<p style="color:#ff4d4d; text-align:center; margin-top:20%;">Failed to load map.</p>';
            }
        }

        async function viewShows(theatreId, theatreName) {
            const container = document.getElementById('shows-' + theatreId);
            if (container.style.display === 'block') {
                container.style.display = 'none';
                return;
            }
            
            container.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Loading shows...';
            container.style.display = 'block';
            
            try {
                const res = await fetch('/show/show-by-theatreId/' + theatreId);
                if (!res.ok) throw new Error('Failed');
                const data = await res.json();
                const shows = data.Show || data.Shows || [];
                
                if (shows.length === 0) {
                    container.innerHTML = '<span style="color:var(--text-muted)">No shows currently scheduled.</span>';
                    return;
                }
                
                container.innerHTML = '<div style="margin-bottom:0.5rem; font-weight:600; color:var(--primary-color);">Currently Showing:</div>' + shows.map(s => {
                    const mName = s.movieId?.title || s.movieId || 'Unknown Movie';
                    const dt = new Date(s.startTime);
                    const time = dt.toLocaleDateString() + ' ' + dt.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
                    return `<div style="background:rgba(0,0,0,0.2); padding:0.5rem; border-radius:6px; margin-bottom:0.5rem; display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <strong>${mName}</strong><br>
                            <span style="color:var(--text-muted); font-size:0.8rem;">${time}</span>
                        </div>
                        <a href="movie.html?id=${s.movieId?._id || s.movieId}" style="color:var(--primary-color); text-decoration:none;"><i class="fa-solid fa-ticket"></i> Book</a>
                    </div>`;
                }).join('');
            } catch(e) {
                container.innerHTML = '<span style="color:#ff4d4d">Error loading shows.</span>';
            }
        }

        document.addEventListener('DOMContentLoaded', fetchTheatres);
    </script>
</body>
</html>
