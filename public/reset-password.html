<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | CineMagic</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            background: linear-gradient(to bottom, rgba(15, 15, 19, 0.8), var(--bg-dark)), url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=2000&auto=format&fit=crop') center/cover;
        }
        .auth-box {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            padding: 3rem;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-header h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: white;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s;
        }
        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(255,51,102,0.2);
        }
        .auth-btn {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            margin-top: 1rem;
            transition: all 0.3s;
            cursor: pointer;
        }
        .auth-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }
        .auth-links {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .auth-links a {
            color: var(--primary-color);
            text-decoration: none;
        }
        #error-msg {
            color: #ff4d4d;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            text-align: center;
            display: none;
        }
        #success-msg {
            color: #4dff88;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="index.html" style="color:var(--primary-color); text-decoration:none;"><i class="fa-solid fa-film"></i> CineMagic</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <h2>Reset Password</h2>
                <p style="color: var(--text-muted)">Enter your new password below</p>
            </div>
            
            <div id="error-msg"></div>
            <div id="success-msg"></div>

            <form id="reset-form">
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="password" class="form-control" required placeholder="Enter new password">
                </div>
                <button type="submit" class="auth-btn">Update Password</button>
            </form>

            <div class="auth-links" id="login-link" style="display: none;">
                <a href="login.html" class="auth-btn" style="display:inline-block; margin-top:0;">Go to Login</a>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');
            const btn = document.querySelector('.auth-btn');
            
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');

            if (!token) {
                errorMsg.textContent = "Invalid or missing reset token.";
                errorMsg.style.display = 'block';
                return;
            }

            try {
                btn.textContent = 'Updating...';
                btn.disabled = true;
                
                const responseText = await Auth.resetPassword(token, password);
                successMsg.textContent = responseText || "Password updated successfully.";
                successMsg.style.display = 'block';
                
                // Hide the form and show the login button
                document.getElementById('reset-form').style.display = 'none';
                document.getElementById('login-link').style.display = 'block';
                
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.style.display = 'block';
                btn.textContent = 'Update Password';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
